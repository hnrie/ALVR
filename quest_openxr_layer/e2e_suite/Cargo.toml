[workspace]
members = [
    "crates/mock_xr_core",
    "crates/mock_xr_runtime",
    "crates/e2e_runner",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
crc32fast = "1.5"
glam = "0.32"
hex = "0.4"
libc = "0.2"
libloading = "0.9"
openxr-sys = { version = "0.13.1", default-features = false }
parking_lot = "0.12"
quick-xml = "0.39"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
zip = { version = "8.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
